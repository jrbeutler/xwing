<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- The game zooms the board itself (pinch); stop the browser zooming the page, which on phones could
         keep a landscape zoom after turning back to portrait. viewport-fit=cover enables the safe-area insets. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <title>Squadron Tactics Prototype</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="viewport"></div>
    <header id="hud"><span id="rp"><span id="round"></span><span id="phase"></span></span></header>
    <aside id="panel"></aside>
    <section id="log"></section>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
